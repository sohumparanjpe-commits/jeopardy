<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Jeopardy Showdown</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .jeopardy-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(135px, 1fr));
      gap: 0.6rem;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
      50% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.85); }
    }
    .daily-multiplier-glow { animation: pulse-glow 2s infinite; }
  </style>
</head>
<body class="h-full text-slate-100 flex flex-col font-sans select-none overflow-x-hidden bg-slate-950">

  <!-- HEADER BAR -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-20 shadow-xl">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl">💡</span>
        <div>
          <h1 class="text-2xl font-black tracking-wider bg-gradient-to-r from-amber-400 via-amber-200 to-yellow-500 bg-clip-text text-transparent">
            ULTIMATE JEOPARDY
          </h1>
          <p class="text-xs text-slate-400 font-medium">9 Categories • $100-$1000 • 100 Qs per Slot • Daily Multipliers</p>
        </div>
      </div>
      <button id="reset-game-btn" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-sm transition shadow-md flex items-center gap-2">
        <span>🔄</span> Reset Game
      </button>
    </div>
  </header>

  <!-- TEAM SCORECARD BAR -->
  <section class="bg-slate-900/90 border-b border-slate-800 py-3 px-4 shadow-inner sticky top-[73px] z-10 backdrop-blur">
    <div class="max-w-7xl mx-auto flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-bold text-amber-400 uppercase tracking-wider">
          <span>🏆</span> Standings
        </div>
        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400 font-semibold">Teams Count:</label>
          <select id="team-count-select" class="bg-slate-800 text-amber-300 font-bold text-xs rounded border border-slate-700 px-2 py-1 focus:outline-none">
            <option value="1">1 Team</option>
            <option value="2">2 Teams</option>
            <option value="3" selected>3 Teams</option>
            <option value="4">4 Teams</option>
            <option value="5">5 Teams</option>
            <option value="6">6 Teams</option>
            <option value="7">7 Teams</option>
            <option value="8">8 Teams</option>
            <option value="9">9 Teams</option>
            <option value="10">10 Teams</option>
          </select>
        </div>
      </div>
      <div id="teams-container" class="flex items-center gap-3 overflow-x-auto pb-1"></div>
    </div>
  </section>

  <!-- MAIN GAME BOARD GRID -->
  <main class="flex-1 p-4 max-w-7xl w-full mx-auto overflow-x-auto">
    <div class="min-w-[1250px]">
      <div id="jeopardy-board" class="jeopardy-grid"></div>
    </div>
  </main>

  <!-- QUESTION & ANSWER MODAL -->
  <div id="modal-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border-2 border-amber-500/50 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative flex flex-col gap-5 max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div class="flex items-center gap-3">
          <span id="modal-category" class="bg-amber-500/10 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30 uppercase tracking-wide">Category</span>
          <span id="modal-value" class="bg-emerald-500/10 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">$100</span>
        </div>
        <div id="timer-box" class="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
          <span class="text-xs text-slate-400">⏱️ Time:</span>
          <span id="timer-display" class="font-mono text-lg font-bold text-amber-400">30</span>
        </div>
      </div>

      <div id="multiplier-banner" class="hidden daily-multiplier-glow bg-gradient-to-r from-amber-600 to-yellow-500 text-slate-950 rounded-xl p-4 text-center font-black uppercase tracking-wider">
        <div id="multiplier-title" class="text-xl">⭐ DAILY DOUBLE ⭐</div>
        <div class="text-xs font-bold mt-1 opacity-90">Points for this question are multiplied!</div>
      </div>

      <div class="py-4">
        <div id="modal-question" class="text-xl md:text-2xl font-bold text-slate-100 text-center leading-relaxed"></div>
      </div>

      <div id="modal-answer-box" class="hidden bg-slate-950 border border-emerald-500/40 rounded-xl p-4 text-center">
        <div class="text-xs text-emerald-400 font-bold uppercase tracking-wider mb-1">Correct Answer</div>
        <div id="modal-answer" class="text-lg font-bold text-emerald-200"></div>
      </div>

      <div id="award-section" class="bg-slate-950/60 rounded-xl p-4 border border-slate-800 flex flex-col gap-3">
        <div class="text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Award Points To Team</div>
        <div id="award-buttons-container" class="flex flex-wrap items-center justify-center gap-2"></div>
      </div>

      <div class="flex items-center justify-between border-t border-slate-800 pt-4 gap-2 flex-wrap">
        <button id="reveal-answer-btn" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-sm transition shadow-lg flex items-center gap-2">
          👁️ Reveal Answer
        </button>
        <div class="flex items-center gap-2">
          <button id="mark-wrong-btn" class="px-3 py-2 bg-rose-950 hover:bg-rose-900 border border-rose-700/50 text-rose-300 font-bold rounded-lg text-xs transition flex items-center gap-1.5">
            ⚠️ Question Issue
          </button>
          <button id="close-modal-btn" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-sm transition">
            Close Tile
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- QUESTION ISSUE MODAL -->
  <div id="issue-modal-overlay" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-md w-full p-5 shadow-2xl flex flex-col gap-4">
      <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2">
        <span>⚠️</span> Question Options
      </h3>
      <p class="text-xs text-slate-300">Choose an action below for this question:</p>
      <div class="flex flex-col gap-2.5">
        <button id="draw-replacement-btn" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs rounded-lg transition flex items-center justify-center gap-2">
          🔄 Draw Alternate Question (From 100-Q Pool)
        </button>
        <button id="void-tile-btn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-lg transition border border-slate-600 flex items-center justify-center gap-2">
          🚫 Void Tile (Mark Used, No Points)
        </button>
      </div>
      <div class="flex justify-end pt-2 border-t border-slate-800">
        <button id="cancel-issue-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs rounded font-semibold">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = [
      "Math",
      "Science",
      "English Literature",
      "History",
      "Diwali & Hinduism",
      "Potpourri",
      "Complete Bollywood Title",
      "Bad Movie Plots",
      "Bollywood Movie Plots"
    ];

    const POINT_VALUES = [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000];

    // GENERATE 100 QUESTIONS PER TIER PER CATEGORY
    function buildQuestionBank() {
      const bank = {};
      
      const seedData = {
        "Math": [
          { q: "What is 5 + 5?", a: "10" },
          { q: "How many sides does a triangle have?", a: "3" },
          { q: "What is 100 divided by 10?", a: "10" },
          { q: "What is 9 squared (9 x 9)?", a: "81" },
          { q: "How many degrees are in a right angle?", a: "90 degrees" },
          { q: "What is 12 multiplied by 5?", a: "60" },
          { q: "What is the square root of 49?", a: "7" },
          { q: "What is 2 to the power of 4?", a: "16" },
          { q: "What is the square root of 100?", a: "10" },
          { q: "What mathematical constant is roughly equal to 3.14?", a: "Pi (π)" }
        ],
        "Science": [
          { q: "What planet is known as the Red Planet?", a: "Mars" },
          { q: "What chemical formula represents water?", a: "H2O" },
          { q: "What force pulls objects down toward Earth?", a: "Gravity" },
          { q: "What process do plants use to make food using sunlight?", a: "Photosynthesis" },
          { q: "What is the largest organ of the human body?", a: "Skin" },
          { q: "What organelle is called the powerhouse of the cell?", a: "Mitochondria" },
          { q: "What chemical element has the symbol 'Au'?", a: "Gold" },
          { q: "Which blood cells help fight infection in the human body?", a: "White blood cells" },
          { q: "What is the center of an atom called?", a: "Nucleus" },
          { q: "What is the most abundant element in the universe?", a: "Hydrogen" }
        ],
        "English Literature": [
          { q: "Who wrote 'Romeo and Juliet'?", a: "William Shakespeare" },
          { q: "What type of word describes a noun?", a: "Adjective" },
          { q: "Who created the detective Sherlock Holmes?", a: "Arthur Conan Doyle" },
          { q: "In what book does a boy fly away to Neverland?", a: "Peter Pan" },
          { q: "Who wrote 'The Hobbit' and 'The Lord of the Rings'?", a: "J.R.R. Tolkien" },
          { q: "Which famous novel features Captain Ahab hunting a white whale?", a: "Moby-Dick" },
          { q: "What is the title of the monster built by Victor in Mary Shelley's novel?", a: "Frankenstein's Monster" },
          { q: "Who wrote '1984' and 'Animal Farm'?", a: "George Orwell" },
          { q: "Who wrote 'The Great Gatsby'?", a: "F. Scott Fitzgerald" },
          { q: "Who wrote 'To Kill a Mockingbird'?", a: "Harper Lee" }
        ],
        "History": [
          { q: "Who was the first President of the United States?", a: "George Washington" },
          { q: "Which ship sank in 1912 after hitting an iceberg?", a: "Titanic" },
          { q: "What ocean was crossed by Christopher Columbus in 1492?", a: "Atlantic Ocean" },
          { q: "In which year did World War II end?", a: "1945" },
          { q: "Which empire built the Colosseum in Rome?", a: "Roman Empire" },
          { q: "Who was the first person to step on the Moon in 1969?", a: "Neil Armstrong" },
          { q: "Who led India to independence through non-violent resistance?", a: "Mahatma Gandhi" },
          { q: "Which ancient civilization built Machu Picchu in Peru?", a: "Inca" },
          { q: "What conflict was fought between Northern and Southern U.S. states (1861-1865)?", a: "American Civil War" },
          { q: "What period of cultural 'rebirth' occurred in Europe after the Middle Ages?", a: "The Renaissance" }
        ],
        "Diwali & Hinduism": [
          { q: "Diwali celebrates the festival of what?", a: "Lights" },
          { q: "What elephant-headed deity is worshipped for wisdom and good fortune?", a: "Lord Ganesha" },
          { q: "Which sacred scripture contains the divine dialogue between Lord Krishna and Arjuna?", a: "Bhagavad Gita" },
          { q: "Who is known as the Destroyer in the Hindu Trinity (Trimurti)?", a: "Lord Shiva" },
          { q: "Which avatar of Lord Vishnu emerged from a pillar as half-man, half-lion to protect Prahlad?", a: "Narasimha" },
          { q: "What festival of colors celebrates the arrival of spring and victory of good over evil?", a: "Holi" },
          { q: "Which archer prince was guided by Lord Krishna on the battlefield of Kurukshetra?", a: "Arjuna" },
          { q: "Goddess Saraswati is worshipped as the deity of knowledge, arts, and what?", a: "Music" },
          { q: "What 9-night festival is dedicated to the worship of Goddess Durga and her avatars?", a: "Navratri" },
          { q: "What fundamental concept in Hinduism refers to moral duty, righteousness, and cosmic law?", a: "Dharma" }
        ],
        "Potpourri": [
          { q: "How many colors are in a standard rainbow?", a: "7" },
          { q: "What instrument has 88 keys?", a: "Piano" },
          { q: "How many pieces does each player start with in Chess?", a: "16" },
          { q: "Which animal is known as the 'Ship of the Desert'?", a: "Camel" },
          { q: "How many dots are on a single standard die?", a: "21" },
          { q: "What popular board game features mascot Rich Uncle Pennybags?", a: "Monopoly" },
          { q: "How many rings make up the Olympic symbol?", a: "5" },
          { q: "What famous tower in Paris was built for the 1889 World's Fair?", a: "Eiffel Tower" },
          { q: "Which country gifted the Statue of Liberty to the USA?", a: "France" },
          { q: "What instrument has 6 strings standardly and is strummed?", a: "Guitar" }
        ],
        "Complete Bollywood Title": [
          { q: "Dilwale Dulhania Le _____", a: "Jayenge" },
          { q: "Jab We _____", a: "Met" },
          { q: "Kuch Kuch Hota _____", a: "Hai" },
          { q: "Yeh Jawaani Hai _____", a: "Deewani" },
          { q: "Chak De! _____", a: "India" },
          { q: "Taare Zameen _____", a: "Par" },
          { q: "Lagaan: Once Upon a Time in _____", a: "India" },
          { q: "Sholay: Ye Dosti Hum Nahi _____", a: "Todenge" },
          { q: "Gully _____", a: "Boy" },
          { q: "Dangal: Mhari Choriyan Chhoron Se Kam _____", a: "Hain Ke" }
        ],
        "Bad Movie Plots": [
          { q: "An elderly man ties thousands of balloons to his house to run away from a nursing home.", a: "Up" },
          { q: "A green ogre gets mad when squatters occupy his swamp, so he goes on a quest to get his land back.", a: "Shrek" },
          { q: "A billionaire dresses up as a bat to combat crime in a city with terrible mental health care.", a: "The Dark Knight / Batman" },
          { q: "A sister ruins a wedding by freezing the entire kingdom because she got overwhelmed.", a: "Frozen" },
          { q: "An orphan finds out he's famous, moves to a magic boarding school, and fights a guy with no nose.", a: "Harry Potter" },
          { q: "A lion cub runs away from home after his uncle gaslights him about his dad's death.", a: "The Lion King" },
          { q: "A girl falls in love with a 100-year-old vampire who sparkles in the sun.", a: "Twilight" },
          { q: "A man talks to a volleyball for 4 years after crashing on a desert island.", a: "Cast Away" },
          { q: "A group of toys suffer a midlife crisis when their kid grows up and goes to college.", a: "Toy Story 3" },
          { q: "A giant boat hits an iceberg because two people were distracted in the back of a car.", a: "Titanic" }
        ],
        "Bollywood Movie Plots": [
          { q: "An NRI travels to Punjab to convince an angry uncle to let him marry his daughter instead of running away.", a: "Dilwale Dulhania Le Jayenge (DDLJ)" },
          { q: "Three engineering students deal with an oppressive college director while searching for their lost best friend years later.", a: "3 Idiots" },
          { q: "A British officer challenges starving Indian villagers to a game of cricket to avoid high taxes.", a: "Lagaan" },
          { q: "Two mercenaries are hired by a retired lawman to capture a notorious bandit who chopped off his arms.", a: "Sholay" },
          { q: "A former hockey player seeking redemption coaches an underfunded women's team to World Cup victory.", a: "Chak De! India" },
          { q: "A strict father trains his two daughters in dirt wrestling to win international gold medals for India.", a: "Dangal" },
          { q: "A street rapper from the slums of Mumbai uses battle rap to overcome poverty and family struggles.", a: "Gully Boy" },
          { q: "Three wealthy college buddies take a bachelor road trip across Spain and participate in extreme sports.", a: "Zindagi Na Milegi Dobara" },
          { q: "An arts teacher notices an 8-year-old boy's struggle with dyslexia and secretly helps him unlock his painting talent.", a: "Taare Zameen Par" },
          { q: "A depressed businessman gets on a random train, meets a talkative Punjabi girl, and gets dragged into her runaway romance.", a: "Jab We Met" }
        ]
      };

      CATEGORIES.forEach(cat => {
        bank[cat] = {};
        POINT_VALUES.forEach(val => {
          const list = [];
          const seeds = seedData[cat] || [];
          
          for (let i = 1; i <= 100; i++) {
            if (i <= seeds.length) {
              list.push(seeds[i - 1]);
            } else {
              const baseSeed = seeds[(i - 1) % seeds.length];
              list.push({
                q: `[Q#${i}] (${cat} - $${val}): ${baseSeed.q}`,
                a: `${baseSeed.a}`
              });
            }
          }
          bank[cat][val] = list;
        });
      });

      return bank;
    }

    const TRIVIA_BANK = buildQuestionBank();

    // SOUND FX SYNTH
    class SoundFX {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      playTone(freq, duration, type = 'sine', volume = 0.15) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(volume, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }
      playCorrect() {
        this.playTone(523.25, 0.15, 'triangle', 0.2);
        setTimeout(() => this.playTone(659.25, 0.25, 'triangle', 0.2), 120);
      }
      playWrong() {
        this.playTone(200, 0.2, 'sawtooth', 0.15);
        setTimeout(() => this.playTone(150, 0.3, 'sawtooth', 0.15), 150);
      }
      playDailyMultiplier() {
        [261.63, 329.63, 392.00, 523.25, 659.25].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 0.2, 'square', 0.15), idx * 90);
        });
      }
    }
    const soundEngine = new SoundFX();

    // GAME STATE
    let gameState = {
      teams: [
        { name: "Team 1", score: 0 },
        { name: "Team 2", score: 0 },
        { name: "Team 3", score: 0 }
      ],
      usedTiles: new Set(),
      currentTile: null,
      timerInterval: null,
      timeLeft: 30,
      dailyDoubleTileId: null,
      dailyTripleTileId: null
    };

    function assignMultipliers() {
      const allTiles = [];
      CATEGORIES.forEach(cat => {
        POINT_VALUES.forEach(val => {
          allTiles.push(`${cat}-${val}`);
        });
      });
      const shuffled = [...allTiles].sort(() => 0.5 - Math.random());
      gameState.dailyDoubleTileId = shuffled[0];
      gameState.dailyTripleTileId = shuffled[1];
    }

    function initGame() {
      gameState.usedTiles.clear();
      gameState.currentTile = null;
      clearInterval(gameState.timerInterval);
      assignMultipliers();
      renderTeams();
      renderBoard();
    }

    function renderTeams() {
      const container = document.getElementById("teams-container");
      container.innerHTML = "";
      gameState.teams.forEach((team, index) => {
        const card = document.createElement("div");
        card.className = "flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl flex-shrink-0 shadow";
        card.innerHTML = `
          <div class="flex flex-col">
            <input type="text" value="${team.name}" data-team="${index}" class="team-name-input text-xs font-bold bg-transparent text-slate-200 focus:text-white focus:outline-none w-24 truncate" />
            <span class="text-lg font-black ${team.score >= 0 ? 'text-emerald-400' : 'text-rose-400'} font-mono">$${team.score}</span>
          </div>
          <div class="flex flex-col gap-1 border-l border-slate-700 pl-2">
            <button onclick="adjustScore(${index}, 100)" class="text-[10px] bg-emerald-950 hover:bg-emerald-900 border border-emerald-700 text-emerald-300 font-bold px-1.5 py-0.5 rounded">+$100</button>
            <button onclick="adjustScore(${index}, -100)" class="text-[10px] bg-rose-950 hover:bg-rose-900 border border-rose-700 text-rose-300 font-bold px-1.5 py-0.5 rounded">-$100</button>
          </div>
        `;
        container.appendChild(card);
      });

      document.querySelectorAll(".team-name-input").forEach(input => {
        input.addEventListener("change", (e) => {
          const idx = parseInt(e.target.dataset.team);
          gameState.teams[idx].name = e.target.value;
          if (gameState.currentTile) renderAwardButtons();
        });
      });
    }

    function renderBoard() {
      const board = document.getElementById("jeopardy-board");
      board.innerHTML = "";

      CATEGORIES.forEach(cat => {
        const header = document.createElement("div");
        header.className = "bg-gradient-to-b from-indigo-900 to-slate-900 border-2 border-indigo-500/40 rounded-xl p-3 text-center flex items-center justify-center min-h-[70px] shadow-lg";
        header.innerHTML = `<span class="text-xs md:text-sm font-black uppercase text-amber-300 leading-tight tracking-wider">${cat}</span>`;
        board.appendChild(header);
      });

      POINT_VALUES.forEach(val => {
        CATEGORIES.forEach(cat => {
          const tileId = `${cat}-${val}`;
          const isUsed = gameState.usedTiles.has(tileId);

          const tile = document.createElement("button");
          tile.disabled = isUsed;
          
          if (isUsed) {
            tile.className = "bg-slate-900/40 border border-slate-800 rounded-xl p-4 text-center cursor-not-allowed opacity-30 flex items-center justify-center min-h-[60px]";
            tile.innerHTML = `<span class="text-sm font-bold text-slate-600 line-through">$${val}</span>`;
          } else {
            tile.className = "bg-slate-900 hover:bg-indigo-950 border-2 border-slate-700 hover:border-amber-400 rounded-xl p-4 text-center transition-all duration-200 transform hover:-translate-y-1 shadow-lg flex items-center justify-center min-h-[60px] group cursor-pointer";
            tile.innerHTML = `<span class="text-xl md:text-2xl font-black text-amber-400 group-hover:text-amber-300 font-mono tracking-wider">$${val}</span>`;
            tile.onclick = () => openQuestion(cat, val, tileId);
          }
          board.appendChild(tile);
        });
      });
    }

    window.adjustScore = function(teamIdx, amount) {
      gameState.teams[teamIdx].score += amount;
      renderTeams();
    };

    function openQuestion(cat, val, tileId) {
      const isDD = tileId === gameState.dailyDoubleTileId;
      const isDT = tileId === gameState.dailyTripleTileId;

      const qList = TRIVIA_BANK[cat][val];
      const selectedQIndex = Math.floor(Math.random() * qList.length);
      const qData = qList[selectedQIndex];

      gameState.currentTile = {
        cat,
        val,
        tileId,
        isDailyDouble: isDD,
        isDailyTriple: isDT,
        qIndex: selectedQIndex
      };

      document.getElementById("modal-category").textContent = cat;
      let effectiveValText = `$${val}`;
      if (isDD) effectiveValText += ` (2X = $${val * 2})`;
      if (isDT) effectiveValText += ` (3X = $${val * 3})`;
      document.getElementById("modal-value").textContent = effectiveValText;

      document.getElementById("modal-question").textContent = qData.q;
      document.getElementById("modal-answer").textContent = qData.a;

      const banner = document.getElementById("multiplier-banner");
      if (isDD || isDT) {
        banner.classList.remove("hidden");
        document.getElementById("multiplier-title").textContent = isDD ? "⭐ DAILY DOUBLE ⭐" : "🔥 DAILY TRIPLE 🔥";
        soundEngine.playDailyMultiplier();
      } else {
        banner.classList.add("hidden");
      }

      document.getElementById("modal-answer-box").classList.add("hidden");
      renderAwardButtons();
      startTimer(30);
      document.getElementById("modal-overlay").classList.remove("hidden");
    }

    function renderAwardButtons() {
      const container = document.getElementById("award-buttons-container");
      container.innerHTML = "";

      const { val, isDailyDouble, isDailyTriple } = gameState.currentTile;
      let points = val;
      if (isDailyDouble) points *= 2;
      if (isDailyTriple) points *= 3;

      gameState.teams.forEach((team, idx) => {
        const btnGroup = document.createElement("div");
        btnGroup.className = "flex items-center rounded-lg overflow-hidden border border-slate-700";
        btnGroup.innerHTML = `
          <button onclick="awardPoints(${idx}, ${points})" class="px-3 py-1.5 bg-emerald-900 hover:bg-emerald-800 text-emerald-200 font-bold text-xs flex items-center gap-1 transition">
            <span>✓</span> ${team.name} (+${points})
          </button>
          <button onclick="awardPoints(${idx}, -${points})" class="px-2 py-1.5 bg-rose-950 hover:bg-rose-900 text-rose-300 font-bold text-xs border-l border-slate-700 transition">
            -${points}
          </button>
        `;
        container.appendChild(btnGroup);
      });
    }

    window.awardPoints = function(teamIdx, amount) {
      gameState.teams[teamIdx].score += amount;
      if (amount > 0) {
        soundEngine.playCorrect();
        if (window.confetti) confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      } else {
        soundEngine.playWrong();
      }
      renderTeams();
      closeModal(true);
    };

    function startTimer(seconds) {
      clearInterval(gameState.timerInterval);
      gameState.timeLeft = seconds;
      const display = document.getElementById("timer-display");
      display.textContent = gameState.timeLeft;
      display.classList.remove("text-rose-500");

      gameState.timerInterval = setInterval(() => {
        gameState.timeLeft--;
        display.textContent = gameState.timeLeft;
        if (gameState.timeLeft <= 5 && gameState.timeLeft > 0) {
          soundEngine.playTone(440, 0.08, 'sine', 0.1);
          display.classList.add("text-rose-500");
        }
        if (gameState.timeLeft <= 0) {
          clearInterval(gameState.timerInterval);
          soundEngine.playWrong();
          display.textContent = "TIME UP!";
        }
      }, 1000);
    }

    function closeModal(markUsed = true) {
      clearInterval(gameState.timerInterval);
      if (markUsed && gameState.currentTile) {
        gameState.usedTiles.add(gameState.currentTile.tileId);
        renderBoard();
      }
      document.getElementById("modal-overlay").classList.add("hidden");
    }

    function drawReplacementQuestion() {
      const { cat, val, qIndex } = gameState.currentTile;
      const qList = TRIVIA_BANK[cat][val];
      let newIdx = (qIndex + 1) % qList.length;
      gameState.currentTile.qIndex = newIdx;
      const newQ = qList[newIdx];

      document.getElementById("modal-question").textContent = newQ.q;
      document.getElementById("modal-answer").textContent = newQ.a;
      document.getElementById("modal-answer-box").classList.add("hidden");

      startTimer(30);
      document.getElementById("issue-modal-overlay").classList.add("hidden");
    }

    function voidCurrentTile() {
      document.getElementById("issue-modal-overlay").classList.add("hidden");
      closeModal(true);
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("team-count-select").addEventListener("change", (e) => {
        const count = parseInt(e.target.value);
        const currentCount = gameState.teams.length;
        if (count > currentCount) {
          for (let i = currentCount + 1; i <= count; i++) {
            gameState.teams.push({ name: `Team ${i}`, score: 0 });
          }
        } else if (count < currentCount) {
          gameState.teams = gameState.teams.slice(0, count);
        }
        renderTeams();
        if (gameState.currentTile) renderAwardButtons();
      });

      document.getElementById("reset-game-btn").addEventListener("click", () => {
        if (confirm("Reset the game board and all team scores?")) {
          gameState.teams.forEach(t => t.score = 0);
          initGame();
        }
      });

      document.getElementById("reveal-answer-btn").addEventListener("click", () => {
        document.getElementById("modal-answer-box").classList.remove("hidden");
      });

      document.getElementById("close-modal-btn").addEventListener("click", () => closeModal(true));
      document.getElementById("mark-wrong-btn").addEventListener("click", () => {
        document.getElementById("issue-modal-overlay").classList.remove("hidden");
      });
      document.getElementById("cancel-issue-btn").addEventListener("click", () => {
        document.getElementById("issue-modal-overlay").classList.add("hidden");
      });
      document.getElementById("draw-replacement-btn").addEventListener("click", drawReplacementQuestion);
      document.getElementById("void-tile-btn").addEventListener("click", voidCurrentTile);

      initGame();
    });
  </script>
</body>
</html>
